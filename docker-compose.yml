services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lead
      POSTGRES_PASSWORD: lead
      POSTGRES_DB: lead_tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lead -d lead_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://lead:lead@db:5432/lead_tracker
      ENRICH_SYNC: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
